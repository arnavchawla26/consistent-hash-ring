[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consistent-hash-ring"
version = "0.1.0"
description = "Consistent hashing with virtual nodes, plus a simulator comparing key movement against naive mod-N hashing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
chring = "chring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
